name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Beide aktuell unterstützten Ubuntu-LTS-Versionen. Die Labels sind bewusst fest gepinnt,
        # damit ein Wechsel von „ubuntu-latest“ die Matrix nicht unbemerkt verschiebt.
        os: [ubuntu-24.04, ubuntu-26.04]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests (Einheits- und Integrationstests mit jsdom)
        run: npm test

  package:
    name: Erweiterung als ZIP bauen
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ZIP bauen
        run: npm run build

      - name: ZIP prüfen
        run: |
          unzip -tq dist/*.zip
          unzip -l dist/*.zip

      - uses: actions/upload-artifact@v7
        with:
          name: yt-gemini-vorleser
          path: dist/*.zip
          if-no-files-found: error
