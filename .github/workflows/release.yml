name: Release

# Hängt das gebaute ZIP (und SHA256SUMS.txt) an ein GitHub-Release.
#
# Einfachster Weg: Auf GitHub unter „Releases“ → „Draft a new release“ einen neuen Tag eintragen (1.2.0 oder v1.2.0)
# und „Publish release“ klicken. Dieser Workflow baut danach das ZIP und hängt es an das Release. Das geht nur,
# solange Releases nicht unveränderlich („immutable“) sind.
#
# Weg, der auch mit „immutable releases“ funktioniert:
#   1. git tag 1.2.0 && git push origin 1.2.0     (mit oder ohne „v“)
#   2. Dieser Workflow legt einen ENTWURF mit ZIP und Release-Notes an
#   3. Auf GitHub den Entwurf prüfen und „Publish release“ klicken
#
# Die Version des ZIPs kommt aus dem TAG, nicht aus manifest.json: Im ZIP wird die Version in manifest.json auf die
# des Tags gesetzt. Wurde vor dem Taggen vergessen, die Version im Repository zu erhöhen, warnt der Lauf, scheitert
# aber nicht (so blieb das Release 1.1.1 ohne ZIP).
#
# Manuell: Actions → Release → Run workflow, z. B. um das ZIP an ein bereits veröffentlichtes Release zu hängen
# („Use workflow from“ = Branch main, wenn der Tag älter als dieser Workflow ist; gebaut wird dann der Stand des
# Branches).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag des Releases, z. B. 1.2.0 oder v1.2.0 (das ZIP trägt diese Version)'
        required: true
        type: string
      replace:
        description: 'Dateien, die schon am Release hängen, ersetzen (bei veröffentlichten Releases sonst übersprungen)'
        required: false
        type: boolean
        default: false

# Release anlegen und Dateien anhängen braucht Schreibrechte auf „contents“, sonst nichts.
permissions:
  contents: write

# Zwei Auslöser für denselben Tag (Tag-Push und „Release veröffentlicht“) laufen nacheinander, nicht gleichzeitig.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  assets:
    name: ZIP bauen und ans Release anhängen
    # Veröffentlicht jemand einen Entwurf, an dem das ZIP schon hängt, ist nichts zu tun.
    if: ${{ github.event_name != 'release' || !contains(join(github.event.release.assets.*.name, ','), 'yt-gemini-vorleser-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: ZIP bauen
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        # Die Version kommt aus dem Tag („v“ davor wird entfernt). Der Tag steht in einer Umgebungsvariablen,
        # nie direkt im Shell-Text.
        run: BUILD_VERSION="${RELEASE_TAG#v}" npm run build

      - name: ZIP prüfen
        run: unzip -tq dist/*.zip

      - name: Release-Dateien anhängen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_REPLACE: ${{ inputs.replace }}
        run: node scripts/release.js
